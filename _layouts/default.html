<!DOCTYPE html>
<html lang="en">
<head>
    <title>{% if page.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="author" content="{{ site.author }}">
    <meta name="description" content="{{ site.description }}">

    <link href='https://fonts.googleapis.com/css?family=Inconsolata:400,700' rel='stylesheet' type='text/css'>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ site.baseurl }}/css/main.css">
</head>
<body>

    <header class="site-header">
        <div class="header-inner">
            
            <img class="profile-picture" src="{{ site.baseurl }}/soumik.jpg" alt="Soumik Ghosh">

            <h1>
                <a id="author-name" href="{{ site.url }}{{ site.baseurl }}/">
                    <span id="first-name">Soumik</span> Ghosh
                </a>
            </h1>

            <p class="bio-text">Software Engineer & Researcher</p>

            <nav class="top-nav">
                <ul>
                    {% for x in site.nav %}
                        <li>
                        {% if x.name == "CV" %}
                            <a target="_blank" href="{{ x.link }}">{{ x.name }}</a>
                        {% else %}
                            <a href="{{ x.link }}">{{ x.name }}</a>
                        {% endif %}
                        </li>
                    {% endfor %}
                </ul>
            </nav>

            <div class="social-icons">
                <a href="mailto:soumikghosh205@gmail.com" title="Email"><i class="fas fa-envelope"></i></a>
                <a href="{{ site.footer_url }}" title="GitHub"><i class="fab fa-github"></i></a>
                <a href="https://www.linkedin.com/in/soumik205/" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
            </div>
            
        </div>
    </header>

    <main class="content-wrapper">
        <div class="container content">
            {{ content }}
        </div>
    </main>

    <footer class="site-footer">
        <p class="copyright-text">
            &copy; Copyright 2025 Soumik Ghosh
        </p>
    </footer>
    
    <script>
        window.onscroll = function() {stickyHeader()};

        var header = document.querySelector(".site-header");
        var stickyThreshold = 200; // The scroll position where the header shrinks

        function stickyHeader() {
            if (window.scrollY > stickyThreshold) {
                header.classList.add("scrolled");
            } else {
                header.classList.remove("scrolled");
            }
        }
    </script>

    {% if site.tracking_id %}
        <script>
          (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
          (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
          m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
          })(window,document,'script','//www.google-analytics.com/analytics.js','ga');
          ga('create', '{{ site.tracking_id }}', 'auto');
          ga('send', 'pageview');
        </script>
    {% endif %}

</body>
</html>
